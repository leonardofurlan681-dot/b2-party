<!DOCTYPE html>
<html>
<head>
    <title>ADM | B2 STREET</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .header-adm { text-align: center; margin-bottom: 30px; }
        .logo-adm { width: 120px; filter: drop-shadow(0 0 10px rgba(200,200,200,0.3)); }
        
        /* Sistema de Abas */
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
        .tab-btn { 
            background: #111; color: #888; border: 1px solid #333; padding: 12px 20px; 
            border-radius: 8px; cursor: pointer; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px;
            transition: 0.3s; width: auto;
        }
        .tab-btn.active { background: linear-gradient(180deg, #dcdcdc, #999999); color: #000; border: none; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { 
            background: #121212; 
            border: 1px solid #444; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        h2 { font-size: 0.8rem; letter-spacing: 2px; color: #aaa; margin-bottom: 20px; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin-bottom: 15px; 
            background: #000; border: 1px solid #333; color: #fff; 
            border-radius: 6px; outline: none; font-family: inherit;
        }
        
        button { 
            width: 100%; padding: 15px; 
            background: linear-gradient(180deg, #dcdcdc, #999999); 
            color: #000; border: none; border-radius: 6px; 
            font-weight: 800; cursor: pointer; text-transform: uppercase;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.5);
            transition: 0.3s;
        }
        button:hover { background: linear-gradient(180deg, #e8e8e8, #b0b0b0); }
        
        .item-list { background: #0a0a0a; padding: 15px; border-radius: 6px; margin-bottom: 10px; font-size: 0.8rem; border: 1px solid #222; }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        
        .btn-del { background: #555; color: #fff; padding: 5px 10px; width: auto; font-size: 0.7rem; border-radius: 4px; border:none; cursor: pointer; }
        .btn-edit { background: #dcdcdc; color: #000; padding: 5px 10px; width: auto; font-size: 0.7rem; border-radius: 4px; border:none; cursor: pointer; }
        
        /* Estilo da Lista Temporária (Carrinho) */
        .temp-item { background: #1a1a1a; padding: 8px; border-radius: 5px; margin-bottom: 5px; font-size: 0.75rem; border-left: 3px solid #999; display: flex; justify-content: space-between; }
        
        .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; text-transform: uppercase; }
        .status-pendente { background: #664d00; color: #ffcc00; border: 1px solid #ffcc00; }
        .status-entregue { background: #063b21; color: #00ff88; border: 1px solid #00ff88; }

        .finance-info { display: flex; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #333; }
        .lucro-text { color: #00ff88; font-weight: bold; }
        small { color: #888; text-transform: uppercase; font-size: 0.65rem; }
    </style>
</head>
<body>

    <div class="header-adm">
        <img src="logo.png" class="logo-adm">
        <p style="font-size: 0.7rem; color: #aaa; margin-top: 10px; letter-spacing: 2px;">PAINEL DE CONTROLE PREMIUM</p>
    </div>

    <div class="nav-tabs">
        <div class="tab-btn active" onclick="openTab('gerenciamento')">GERENCIAMENTO</div>
        <div class="tab-btn" onclick="openTab('anotacoes')">ANOTAÇÕES DE PEDIDOS</div>
    </div>

    <!-- ABA 1: GERENCIAMENTO -->
    <div id="gerenciamento" class="tab-content active">
        <!-- Manutenção de Banners, Produtos e Cupons conforme código original -->
        <div class="card">
            <h2><i class="fas fa-image"></i> GERENCIAR BANNERS</h2>
            <input type="text" id="b-url" placeholder="Link da imagem do banner">
            <button onclick="addBanner()">ADICIONAR BANNER</button>
            <div id="lista-banners" style="margin-top: 20px;"></div>
        </div>

        <div class="card">
            <h2><i class="fas fa-box"></i> NOVO PRODUTO</h2>
            <input type="text" id="p-nome" placeholder="Nome do Produto">
            <input type="text" id="p-preco" placeholder="Preço (Ex: 199,90)">
            <select id="p-cat">
                <option value="tenis">Tênis</option>
                <option value="chinelos">Chinelos</option>
                <option value="raul">Raul</option>
                <option value="camisas">Camisas</option>
                <option value="conjuntos">Conjuntos</option>
                <option value="shorts">Shorts</option>
                <option value="joias">Joias</option>
            </select>
            <input type="text" id="p-img" placeholder="Link da Imagem do Produto">
            <button onclick="addProduto()">CADASTRAR PRODUTO</button>
        </div>

        <div class="card">
            <h2><i class="fas fa-ticket-alt"></i> GERENCIAR CUPONS</h2>
            <input type="text" id="cupom-codigo" placeholder="Código do Cupom (EX: B2PRIME)">
            <input type="number" id="cupom-valor" placeholder="Valor do Desconto em R$ (EX: 50)">
            <button onclick="addCupom()">CRIAR CUPOM</button>
            <div id="lista-cupons" style="margin-top: 20px;"></div>
        </div>

        <div class="card">
            <h2><i class="fas fa-list"></i> PRODUTOS CADASTRADOS</h2>
            <div id="lista-produtos"></div>
        </div>
    </div>

    <!-- ABA 2: ANOTAÇÕES DE PEDIDOS (MULTI-PRODUTOS) -->
    <div id="anotacoes" class="tab-content">
        <div class="card">
            <h2><i class="fas fa-user"></i> DADOS DO CLIENTE</h2>
            <input type="text" id="ped-cliente" placeholder="Nome do Cliente">
            
            <div style="background: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px;">
                <h3 style="font-size: 0.65rem; color: #888; margin-bottom: 10px;">ADICIONAR PRODUTOS AO PEDIDO:</h3>
                <input type="text" id="temp-nome" placeholder="Nome do Produto (Ex: Jordan 4)">
                
                <div style="display: flex; gap: 10px;">
                    <select id="temp-tipo" onchange="atualizarTamanhos()" style="flex:1">
                        <option value="tenis">Tênis</option>
                        <option value="camisas">Camisas</option>
                        <option value="calças">Calças</option>
                        <option value="shorts">Shorts</option>
                        <option value="conjuntos">Conjuntos</option>
                    </select>
                    <select id="temp-tam" style="flex:1"></select>
                    <input type="number" id="temp-qtd" value="1" min="1" style="flex:0.5" placeholder="Qtd">
                </div>
                <button onclick="adicionarItemNaLista()" style="background: #333; color: #fff; padding: 8px; font-size: 0.65rem;">+ ADICIONAR ESTE ITEM</button>
                
                <div id="carrinho-temporario" style="margin-top: 15px;">
                    <!-- Itens adicionados aparecem aqui -->
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div style="flex:1">
                    <label style="font-size: 0.6rem; color: #888;">VALOR TOTAL SITE (R$):</label>
                    <input type="text" id="ped-valor-site" placeholder="Ex: 599,90">
                </div>
                <div style="flex:1">
                    <label style="font-size: 0.6rem; color: #888;">LUCRO TOTAL (R$):</label>
                    <input type="text" id="ped-valor-lucro" placeholder="Ex: 240,00">
                </div>
            </div>

            <select id="ped-status">
                <option value="pendente">Status: Pendente</option>
                <option value="entregue">Status: Entregue</option>
            </select>
            
            <button onclick="salvarPedidoCompleto()">FINALIZAR E SALVAR PEDIDO</button>
        </div>

        <div id="lista-anotacoes"></div>
    </div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyD1Phuyxe5du5aMPG3rn4BxAiKdYp0uFuI",
    authDomain: "b2-street-501f4.firebaseapp.com",
    projectId: "b2-street-501f4",
    storageBucket: "b2-street-501f4.firebasestorage.app",
    messagingSenderId: "975888104452",
    appId: "1:975888104452:web:1d02d83e0155c67a3fc951",
    databaseURL: "https://b2-street-501f4-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let itensDoPedido = [];

function openTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if(event) event.currentTarget.classList.add('active');
}

function atualizarTamanhos() {
    const tipo = document.getElementById('temp-tipo').value;
    const selectTam = document.getElementById('temp-tam');
    selectTam.innerHTML = "";
    if(tipo === 'tenis') {
        for(let i=35; i<=44; i++) selectTam.innerHTML += `<option value="${i}">${i}</option>`;
    } else {
        ['P', 'M', 'G', 'GG', 'G1'].forEach(t => selectTam.innerHTML += `<option value="${t}">${t}</option>`);
    }
}
atualizarTamanhos();

function adicionarItemNaLista() {
    const nome = document.getElementById('temp-nome').value;
    const tam = document.getElementById('temp-tam').value;
    const qtd = document.getElementById('temp-qtd').value;
    const tipo = document.getElementById('temp-tipo').value;

    if(!nome) return alert("Digite o nome do produto!");

    itensDoPedido.push({ nome, tam, qtd, tipo });
    renderizarCarrinho();
    document.getElementById('temp-nome').value = "";
}

function renderizarCarrinho() {
    const div = document.getElementById('carrinho-temporario');
    div.innerHTML = "";
    itensDoPedido.forEach((item, index) => {
        div.innerHTML += `
            <div class="temp-item">
                <span>${item.qtd}x ${item.nome} (${item.tam})</span>
                <span style="color:red; cursor:pointer" onclick="removerItemCarrinho(${index})">remover</span>
            </div>
        `;
    });
}

function removerItemCarrinho(index) {
    itensDoPedido.splice(index, 1);
    renderizarCarrinho();
}

function salvarPedidoCompleto() {
    const cliente = document.getElementById('ped-cliente').value;
    const vSite = document.getElementById('ped-valor-site').value;
    const vLucro = document.getElementById('ped-valor-lucro').value;
    const status = document.getElementById('ped-status').value;

    if(!cliente || itensDoPedido.length === 0) return alert("Preencha o cliente e adicione pelo menos 1 produto!");

    db.ref('anotacoes_pedidos').push({
        cliente,
        itens: itensDoPedido,
        vSite,
        vLucro,
        status,
        data: new Date().toLocaleString('pt-BR')
    }).then(() => {
        alert("Pedido completo salvo com sucesso!");
        itensDoPedido = [];
        renderizarCarrinho();
        document.getElementById('ped-cliente').value = "";
        document.getElementById('ped-valor-site').value = "";
        document.getElementById('ped-valor-lucro').value = "";
    });
}

db.ref('anotacoes_pedidos').on('value', snap => {
    const div = document.getElementById('lista-anotacoes');
    div.innerHTML = "";
    snap.forEach(item => {
        const p = item.val();
        let listaItensHtml = "";
        p.itens.forEach(i => {
            listaItensHtml += `<div style="color:#eee; font-size:0.75rem">• ${i.qtd}x ${i.nome} - Tam: ${i.tam}</div>`;
        });

        div.innerHTML += `
        <div class="item-list">
            <div class="item-header">
                <div>
                    <span class="status-badge status-${p.status}">${p.status}</span><br>
                    <b style="font-size:1rem; color:#fff">${p.cliente}</b>
                </div>
                <button class="btn-del" onclick="db.ref('anotacoes_pedidos/${item.key}').remove()">🗑️</button>
            </div>
            <div style="margin: 10px 0;">
                ${listaItensHtml}
            </div>
            <div class="finance-info">
                <div style="flex:1"><small>Venda:</small><br>R$ ${p.vSite}</div>
                <div style="flex:1"><small>Lucro:</small><br><span class="lucro-text">R$ ${p.vLucro}</span></div>
            </div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-edit" onclick="alternarStatus('${item.key}', '${p.status}')">Mudar Status</button>
            </div>
        </div>`;
    });
});

function alternarStatus(id, s) { db.ref('anotacoes_pedidos/' + id).update({ status: s === "pendente" ? "entregue" : "pendente" }); }

// Funções Originais Mantidas
function addBanner() {
    const url = document.getElementById('b-url').value;
    if(url) db.ref('banners').push({ url }).then(() => { document.getElementById('b-url').value = ""; alert("Banner OK!"); });
}
db.ref('banners').on('value', snap => {
    const div = document.getElementById('lista-banners'); div.innerHTML = "";
    snap.forEach(c => {
        div.innerHTML += `<div class="item-list" style="display:flex; align-items:center; gap:10px;">
            <img src="${c.val().url}" style="width:40px; height:40px; object-fit:cover; border-radius:4px">
            <span style="flex:1">Banner</span>
            <button class="btn-del" onclick="db.ref('banners/${c.key}').remove()">Excluir</button>
        </div>`;
    });
});
function addCupom() {
    const codigo = document.getElementById('cupom-codigo').value.toUpperCase().trim();
    const valor = document.getElementById('cupom-valor').value;
    if(codigo && valor) {
        db.ref('cupons/' + codigo).set({ valor: parseFloat(valor) })
        .then(() => { alert("Cupom OK!"); document.getElementById('cupom-codigo').value = ""; document.getElementById('cupom-valor').value = ""; });
    }
}
db.ref('cupons').on('value', snap => {
    const div = document.getElementById('lista-cupons'); div.innerHTML = "";
    snap.forEach(c => {
        div.innerHTML += `<div class="item-list"><span style="flex:1"><b>${c.key}</b></span>
            <button class="btn-del" onclick="db.ref('cupons/${c.key}').remove()">Excluir</button></div>`;
    });
});
function addProduto() {
    const nome = document.getElementById('p-nome').value;
    const preco = document.getElementById('p-preco').value;
    const categoria = document.getElementById('p-cat').value;
    const imagem = document.getElementById('p-img').value;
    if(nome && preco && imagem) {
        db.ref('produtos').push({ nome, preco, categoria, imagem }).then(() => {
            alert("Produto OK!"); document.getElementById('p-nome').value = ""; document.getElementById('p-preco').value = ""; document.getElementById('p-img').value = "";
        });
    }
}
db.ref('produtos').on('value', snap => {
    const div = document.getElementById('lista-produtos'); div.innerHTML = "";
    snap.forEach(c => {
        const p = c.val();
        div.innerHTML += `<div class="item-list" style="display:flex; align-items:center; gap:10px;">
            <img src="${p.imagem}" style="width:40px; height:40px; object-fit:cover; border-radius:4px">
            <span style="flex:1">${p.nome} <br> <small>R$ ${p.preco}</small></span>
            <button class="btn-edit" onclick="editarProduto('${c.key}', '${p.nome}', '${p.preco}')">Editar</button>
            <button class="btn-del" onclick="db.ref('produtos/${c.key}').remove()">Excluir</button>
        </div>`;
    });
});
function editarProduto(id, n, p) {
    const novoN = prompt("Nome:", n); const novoP = prompt("Preço:", p);
    if (novoN && novoP) db.ref('produtos/' + id).update({ nome: novoN, preco: novoP });
}
</script>
</body>
</html>
