<!<!DOCTYPE html>
<html>
<head>
    <title>ADM | B2 STREET</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .header-adm { text-align: center; margin-bottom: 30px; }
        .logo-adm { width: 120px; filter: drop-shadow(0 0 10px rgba(200,200,200,0.3)); }
        
        /* Estética Silver */
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { 
            background: #111; color: #888; border: 1px solid #333; padding: 12px 20px; 
            border-radius: 8px; cursor: pointer; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px;
            transition: 0.3s;
        }
        .tab-btn.active { background: linear-gradient(180deg, #dcdcdc, #999999); color: #000; border: none; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: #121212; border: 1px solid #444; padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { font-size: 0.8rem; letter-spacing: 2px; color: #aaa; margin-bottom: 20px; text-transform: uppercase; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; outline: none; font-family: inherit; }
        button { width: 100%; padding: 15px; background: linear-gradient(180deg, #dcdcdc, #999999); color: #000; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        
        .item-list { background: #0a0a0a; padding: 15px; border-radius: 6px; margin-bottom: 10px; font-size: 0.8rem; border: 1px solid #444; }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        
        .btn-del { background: #444 !important; color: #fff !important; width: auto !important; padding: 5px 10px !important; font-size: 0.7rem !important; }
        .btn-edit { background: #dcdcdc !important; color: #000 !important; width: auto !important; padding: 5px 10px !important; font-size: 0.7rem !important; }
        .btn-save { background: #dcdcdc !important; color: #000 !important; width: auto !important; padding: 8px 15px !important; font-size: 0.7rem !important; margin-top: 5px; }
        
        .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; text-transform: uppercase; display: inline-block; color: #000; background: #999; }
        
        .temp-item { background: #1a1a1a; padding: 8px; border-radius: 5px; margin-bottom: 5px; font-size: 0.75rem; border-left: 3px solid #999; display: flex; justify-content: space-between; }
        .finance-info { display: flex; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #333; }
        .lucro-text { color: #00ff00; font-weight: bold; }
        small { color: #888; text-transform: uppercase; font-size: 0.65rem; }

        .prod-img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="header-adm">
        <img src="logo.png" class="logo-adm">
        <p style="font-size: 0.7rem; color: #aaa; margin-top: 10px; letter-spacing: 2px;">PAINEL DE CONTROLE PREMIUM</p>
    </div>

    <div class="nav-tabs">
        <div class="tab-btn active" onclick="openTab('vendas-site')">PEDIDOS DO SITE</div>
        <div class="tab-btn" onclick="openTab('anotacoes')">ANOTAÇÕES MANUAIS</div>
        <div class="tab-btn" onclick="openTab('gerenciamento')">SITE & CUPONS</div>
    </div>

    <!-- ABA 1: PEDIDOS DO SITE -->
    <div id="vendas-site" class="tab-content active">
        <div class="card">
            <h2><i class="fas fa-shopping-cart"></i> Pedidos Realizados no Site</h2>
            <div id="lista-pedidos-site">Carregando pedidos...</div>
        </div>
    </div>

    <!-- ABA 2: ANOTAÇÕES MANUAIS -->
    <div id="anotacoes" class="tab-content">
        <div class="card">
            <h2><i class="fas fa-user"></i> CRIAR ANOTAÇÃO MANUAL</h2>
            <input type="text" id="ped-cliente" placeholder="Nome do Cliente">
            
            <div style="background: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px;">
                <h3 style="font-size: 0.65rem; color: #888; margin-bottom: 10px;">ADICIONAR PRODUTOS:</h3>
                <input type="text" id="temp-nome" placeholder="Produto (Ex: Jordan 4)">
                <div style="display: flex; gap: 10px;">
                    <select id="temp-tipo" onchange="atualizarTamanhos()" style="flex:1">
                        <option value="tenis">Tênis</option>
                        <option value="camisas">Camisas</option>
                        <option value="conjuntos">Conjuntos</option>
                        <option value="shorts">Shorts</option>
                    </select>
                    <select id="temp-tam" style="flex:1"></select>
                    <input type="text" id="temp-preco-item" placeholder="Preço Un. (R$)" style="flex:1">
                    <input type="number" id="temp-qtd" value="1" min="1" style="flex:0.5">
                </div>
                <button onclick="adicionarItemNaLista()" style="background: #333; color: #fff; padding: 10px; font-size: 0.7rem; margin-top: 10px;">+ ADICIONAR ITEM AO PEDIDO</button>
                <div id="carrinho-temporario" style="margin-top: 15px;"></div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div style="flex:1">
                    <label style="font-size: 0.6rem; color: #888;">VALOR TOTAL VENDA (R$):</label>
                    <input type="text" id="ped-valor-site" placeholder="Ex: 500,00">
                </div>
                <div style="flex:1">
                    <label style="font-size: 0.6rem; color: #888;">VALOR QUE EU GASTO (R$):</label>
                    <input type="text" id="ped-valor-gasto" placeholder="Ex: 250,00">
                </div>
            </div>

            <select id="ped-status">
                <option value="pendente">Status: Pendente</option>
                <option value="preparando">Status: Preparando</option>
                <option value="entregue">Status: Entregue</option>
            </select>
            <button onclick="salvarPedidoCompleto()">FINALIZAR E SALVAR ANOTAÇÃO</button>
        </div>
        <div id="lista-anotacoes"></div>
    </div>

    <!-- ABA 3: GERENCIAMENTO -->
    <div id="gerenciamento" class="tab-content">
        <!-- SEÇÃO CUPONS -->
        <div class="card">
            <h2><i class="fas fa-ticket-alt"></i> SISTEMA DE CUPONS</h2>
            <div style="background: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px;">
                <input type="text" id="cupom-nome" placeholder="NOME DO CUPOM (Ex: B2STREET10)">
                <input type="number" id="cupom-desconto" placeholder="DESCONTO EM R$ (Apenas números)">
                <select id="cupom-tipo-valido">
                    <option value="todos">Válido para: Todos os Produtos</option>
                    <option value="tenis">Tênis</option>
                    <option value="chinelos">Chinelos</option>
                    <option value="raul">Raul</option>
                    <option value="camisas">Camisas</option>
                    <option value="conjuntos">Conjuntos</option>
                    <option value="shorts">Shorts</option>
                    <option value="joias">Joias</option>
                </select>
                <button onclick="addCupom()">CRIAR NOVO CUPOM</button>
            </div>
            <div id="lista-cupons"></div>
        </div>

        <div class="card">
            <h2><i class="fas fa-image"></i> GERENCIAR BANNERS</h2>
            <input type="text" id="b-url" placeholder="Link da imagem do banner">
            <button onclick="addBanner()">ADICIONAR BANNER</button>
            <div id="lista-banners" style="margin-top: 20px;"></div>
        </div>

        <div class="card">
            <h2><i class="fas fa-box"></i> GERENCIAR PRODUTOS DO SITE</h2>
            <div style="background: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px;">
                <input type="text" id="p-nome" placeholder="Nome do Produto">
                <input type="text" id="p-preco" placeholder="Preço (Ex: 199,90)">
                <select id="p-cat">
                    <option value="tenis">Tênis</option>
                    <option value="chinelos">Chinelos</option>
                    <option value="raul">Raul</option>
                    <option value="camisas">Camisas</option>
                    <option value="conjuntos">Conjuntos</option>
                    <option value="shorts">Shorts</option>
                    <option value="joias">Joias</option>
                </select>
                <input type="text" id="p-img" placeholder="Link da Imagem">
                <button onclick="addProduto()">CADASTRAR PRODUTO</button>
            </div>
            <div id="lista-produtos"></div>
        </div>
    </div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyD1Phuyxe5du5aMPG3rn4BxAiKdYp0uFuI",
    authDomain: "b2-street-501f4.firebaseapp.com",
    projectId: "b2-street-501f4",
    storageBucket: "b2-street-501f4.firebasestorage.app",
    messagingSenderId: "975888104452",
    appId: "1:975888104452:web:1d02d83e0155c67a3fc951",
    databaseURL: "https://b2-street-501f4-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function openTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
}

function atualizarTamanhos() {
    const tipo = document.getElementById('temp-tipo').value;
    const selectTam = document.getElementById('temp-tam');
    selectTam.innerHTML = "";
    if(tipo === 'tenis') {
        for(let i=35; i<=44; i++) selectTam.innerHTML += `<option value="${i}">${i}</option>`;
    } else {
        ['P', 'M', 'G', 'GG', 'G1'].forEach(t => selectTam.innerHTML += `<option value="${t}">${t}</option>`);
    }
}
atualizarTamanhos();

// --- SISTEMA DE CUPONS ---
function addCupom() {
    const nome = document.getElementById('cupom-nome').value.toUpperCase().trim();
    const desc = document.getElementById('cupom-desconto').value;
    const tipoValido = document.getElementById('cupom-tipo-valido').value;
    if(!nome || !desc) return alert("Preencha o nome e o valor de desconto!");
    db.ref('cupons').child(nome).set({ valor: desc, tipoValido: tipoValido }).then(() => {
        alert("Cupom criado!");
        document.getElementById('cupom-nome').value = "";
        document.getElementById('cupom-desconto').value = "";
        document.getElementById('cupom-tipo-valido').value = "todos";
    });
}

db.ref('cupons').on('value', snap => {
    const div = document.getElementById('lista-cupons');
    div.innerHTML = "";
    snap.forEach(c => {
        const dados = c.val();
        const valorExibido = dados.valor || dados.porcentagem || "0";
        const tipoExibido = dados.tipoValido ? dados.tipoValido.toUpperCase() : "TODOS";
        div.innerHTML += `
        <div class="item-list" style="display:flex; justify-content:space-between; align-items:center;">
            <span><i class="fas fa-tag"></i> <b>${c.key}</b> (R$ ${valorExibido} OFF - Válido: ${tipoExibido})</span>
            <button class="btn-del" onclick="db.ref('cupons/${c.key}').remove()">EXCLUIR</button>
        </div>`;
    });
});

// Helper para definir cor do status badge
function obterEstiloStatus(status) {
    const st = String(status).toLowerCase();
    if (st === 'entregue') return 'background-color: #00ff00; color: #000;';
    if (st === 'preparando') return 'background-color: #ffff00; color: #000;';
    return 'background: #999; color: #000;';
}

// --- PEDIDOS DO SITE ---
db.ref('todos_pedidos').on('value', snap => {
    const div = document.getElementById('lista-pedidos-site');
    div.innerHTML = "";
    snap.forEach(child => {
        const p = child.val();
        const id = child.key;
        let totalLimpo = p.total ? p.total.toString().toLowerCase().replace(/total:/g, '').trim() : '0,00';
        const estiloStatus = obterEstiloStatus(p.status || 'Pendente');
        
        div.innerHTML += `
            <div class="item-list" style="border-left: 4px solid #999">
                <div class="item-header">
                    <div><span class="status-badge" style="${estiloStatus}">${p.status || 'Pendente'}</span><br><b>${p.cliente || 'Sem Nome'}</b></div>
                    <button class="btn-del" onclick="if(confirm('Excluir este pedido?')) firebase.database().ref('todos_pedidos/${id}').remove()">🗑️ EXCLUIR</button>
                </div>
                <div style="font-size:0.75rem; color:#aaa; margin-bottom:10px; background: #111; padding: 10px; border-radius: 5px;">
                    <b>ENTREGA:</b><br>
                    CEP: ${p.cep || '---'} | WhatsApp: ${p.whatsapp || '---'}<br>
                    End: ${p.endereco || '---'}<br>
                    CPF: ${p.cpf || '---'}
                </div>
                <div style="margin:10px 0; background:#111; padding:8px; border-radius:4px;">
                    ${p.produtos ? p.produtos.map(i => `• ${i.nome} (${i.tamanho || '---'})`).join('<br>') : 'Sem itens'}
                    <div style="margin-top:5px; color:#dcdcdc; font-weight:bold">Total: R$ ${totalLimpo}</div>
                </div>
                <input type="text" id="rastreio-${id}" placeholder="Código de Rastreio" value="${p.rastreio || ''}" style="margin-bottom:5px; padding:8px; font-size:0.7rem;">
                <div style="display:flex; gap:5px">
                    <button onclick="db.ref('todos_pedidos/${id}').update({rastreio: document.getElementById('rastreio-${id}').value}); alert('Rastreio Salvo!')" style="padding:8px; font-size:0.6rem; flex:1">SALVAR RASTREIO</button>
                    <select onchange="db.ref('todos_pedidos/${id}').update({status: this.value})" style="flex:1; padding:8px; font-size:0.6rem; margin:0">
                        <option value="">Status...</option>
                        <option value="Preparando">Preparando</option>
                        <option value="Enviado">Enviado</option>
                        <option value="Entregue">Entregue</option>
                    </select>
                </div>
            </div>`;
    });
});

// --- ANOTAÇÕES MANUAIS ---
let itensDoPedido = [];
function adicionarItemNaLista() {
    const nome = document.getElementById('temp-nome').value;
    const tam = document.getElementById('temp-tam').value;
    const qtd = document.getElementById('temp-qtd').value;
    const preco = document.getElementById('temp-preco-item').value;
    if(!nome || !preco) return alert("Preencha os dados do item!");
    itensDoPedido.push({ nome, tam, qtd, preco });
    renderizarCarrinho();
    let total = 0;
    itensDoPedido.forEach(i => total += (parseFloat(i.preco.replace(',','.')) * i.qtd));
    document.getElementById('ped-valor-site').value = total.toFixed(2).replace('.',',');
}

function renderizarCarrinho() {
    const div = document.getElementById('carrinho-temporario');
    div.innerHTML = "";
    itensDoPedido.forEach((item, index) => {
        div.innerHTML += `<div class="temp-item"><span>${item.qtd}x ${item.nome} (${item.tam})</span><span style="color:red; cursor:pointer" onclick="itensDoPedido.splice(${index}, 1); renderizarCarrinho()">remover</span></div>`;
    });
}

function salvarPedidoCompleto() {
    const cliente = document.getElementById('ped-cliente').value;
    const vVenda = document.getElementById('ped-valor-site').value;
    const vGasto = document.getElementById('ped-valor-gasto').value;
    const status = document.getElementById('ped-status').value;
    const vendaNum = parseFloat(vVenda.replace(',','.'));
    const gastoNum = parseFloat(vGasto.replace(',','.')) || 0;
    const lucro = (vendaNum - gastoNum).toFixed(2).replace('.',',');
    db.ref('anotacoes_pedidos').push({
        cliente, itens: itensDoPedido, vVenda, vGasto: vGasto || "0,00", vLucro: lucro, status, rastreio: "", data: new Date().toLocaleString('pt-BR')
    }).then(() => {
        alert("Anotação salva!");
        itensDoPedido = []; renderizarCarrinho();
        document.getElementById('ped-cliente').value = ""; document.getElementById('ped-valor-site').value = ""; document.getElementById('ped-valor-gasto').value = "";
    });
}

db.ref('anotacoes_pedidos').on('value', snap => {
    const div = document.getElementById('lista-anotacoes');
    div.innerHTML = "";
    snap.forEach(item => {
        const p = item.val();
        const id = item.key;
        let prodHtml = p.itens ? p.itens.map(i => `<div style="font-size:0.75rem">• ${i.qtd}x ${i.nome} (${i.tam})</div>`).join('') : '';
        const estiloStatus = obterEstiloStatus(p.status);

        div.innerHTML += `
        <div class="item-list">
            <div class="item-header">
                <div><span class="status-badge" style="${estiloStatus}">${p.status}</span><br><b>${p.cliente}</b></div>
                <div style="display:flex; gap:5px">
                   <button class="btn-edit" onclick="document.getElementById('edit-anot-${id}').style.display='block'"><i class="fas fa-edit"></i></button>
                   <button class="btn-del" onclick="if(confirm('Excluir?')) db.ref('anotacoes_pedidos/${id}').remove()">🗑️</button>
                </div>
            </div>
            <div style="margin:10px 0;">${prodHtml}</div>
            
            <div id="edit-anot-${id}" style="display:none; background:#1a1a1a; padding:10px; border-radius:8px; margin-bottom:10px;">
                <label style="font-size:0.6rem; color:#888;">NOME DO CLIENTE:</label>
                <input type="text" id="edit-cli-nome-${id}" value="${p.cliente}" style="padding:8px; font-size:0.7rem;">
                <label style="font-size:0.6rem; color:#888;">VALOR DA VENDA (R$):</label>
                <input type="text" id="edit-cli-venda-${id}" value="${p.vVenda}" style="padding:8px; font-size:0.7rem;">
                <button class="btn-save" onclick="salvarEdicaoAnotacao('${id}', '${p.vGasto}')">SALVAR ALTERAÇÕES</button>
            </div>

            <div class="finance-info">
                <div style="flex:1"><small>Venda:</small><br>R$ ${p.vVenda}</div>
                <div style="flex:1"><small>Lucro:</small><br><span class="lucro-text">R$ ${p.vLucro}</span></div>
            </div>
            
            <div style="margin-top:15px;">
                <input type="text" id="rastreio-anot-${id}" placeholder="Código de Rastreio" value="${p.rastreio || ''}" style="margin-bottom:5px; padding:8px; font-size:0.7rem;">
                <div style="display:flex; gap:5px">
                    <button onclick="db.ref('anotacoes_pedidos/${id}').update({rastreio: document.getElementById('rastreio-anot-${id}').value}); alert('Rastreio Atualizado!')" style="padding:8px; font-size:0.6rem; flex:1">SALVAR RASTREIO</button>
                    <select onchange="db.ref('anotacoes_pedidos/${id}').update({status: this.value})" style="flex:1; padding:8px; font-size:0.6rem; margin:0">
                        <option value="">Alterar Status...</option>
                        <option value="pendente">Pendente</option>
                        <option value="preparando">Preparando</option>
                        <option value="entregue">Entregue</option>
                    </select>
                </div>
            </div>
        </div>`;
    });
});

function salvarEdicaoAnotacao(id, vGasto) {
    const novoNome = document.getElementById('edit-cli-nome-' + id).value;
    const novaVenda = document.getElementById('edit-cli-venda-' + id).value;
    const vendaNum = parseFloat(novaVenda.replace(',','.'));
    const gastoNum = parseFloat(vGasto.replace(',','.'));
    const novoLucro = (vendaNum - gastoNum).toFixed(2).replace('.',',');

    db.ref('anotacoes_pedidos/' + id).update({
        cliente: novoNome,
        vVenda: novaVenda,
        vLucro: novoLucro
    }).then(() => {
        alert("Dados do cliente updated!");
        document.getElementById('edit-anot-' + id).style.display = 'none';
    });
}

// --- SITE (BANNERS E PRODUTOS) ---
function addBanner() {
    const url = document.getElementById('b-url').value;
    if(url) db.ref('banners').push({ url }).then(() => { document.getElementById('b-url').value = ""; });
}
db.ref('banners').on('value', snap => {
    const div = document.getElementById('lista-banners'); div.innerHTML = "";
    snap.forEach(c => { div.innerHTML += `<div class="item-list" style="display:flex; justify-content:space-between; align-items:center;"><img src="${c.val().url}" height="40"> <button class="btn-del" onclick="db.ref('banners/${c.key}').remove()">X</button></div>`; });
});

function addProduto() {
    const nome = document.getElementById('p-nome').value;
    const preco = document.getElementById('p-preco').value;
    const cat = document.getElementById('p-cat').value;
    const img = document.getElementById('p-img').value;
    if(nome && preco) db.ref('produtos').push({ nome, preco, categoria: cat, imagem: img }).then(() => { alert("Produto cadastrado!"); });
}

db.ref('produtos').on('value', snap => {
    const div = document.getElementById('lista-produtos'); div.innerHTML = "";
    snap.forEach(c => {
        const prod = c.val();
        const id = c.key;
        div.innerHTML += `
        <div class="item-list">
            <div style="display:flex; gap:10px; align-items:center;">
                <img src="${prod.imagem}" class="prod-img-preview" onerror="this.src='https://via.placeholder.com/50'">
                <div style="flex:1"><b>${prod.nome}</b><br>R$ ${prod.preco}</div>
                <div style="display:flex; gap:5px;">
                    <button class="btn-edit" onclick="document.getElementById('edit-box-${id}').style.display='block'"><i class="fas fa-edit"></i></button>
                    <button class="btn-del" onclick="if(confirm('Excluir?')) db.ref('produtos/${id}').remove()">🗑️</button>
                </div>
            </div>
            <div id="edit-box-${id}" style="display:none; margin-top:10px; border-top:1px solid #333; padding-top:10px;">
                <input type="text" id="edit-nome-${id}" value="${prod.nome}" style="padding:8px;">
                <input type="text" id="edit-preco-${id}" value="${prod.preco}" style="padding:8px;">
                <button class="btn-save" onclick="salvarEdicao('${id}')">SALVAR</button>
            </div>
        </div>`;
    });
});

function salvarEdicao(id) {
    const nome = document.getElementById('edit-nome-' + id).value;
    const preco = document.getElementById('edit-preco-' + id).value;
    db.ref('produtos/' + id).update({ nome, preco }).then(() => {
        alert("Atualizado!");
        document.getElementById('edit-box-' + id).style.display='none';
    });
}
</script>
</body>
</html>
